# Development stack: API + PostGIS + GeoServer + Metabase
services:
  db-dev:
    # Main PostGIS database used by the API
    image: kartoza/postgis:15-3.3
    container_name: agora-dev-db-kartoza
    volumes:
      - agora-dev-db-data:/var/lib/postgresql
    ports:
      - ${DATABASE_PORT}:5432 # Map host port 5434 to container port 5432
    environment:
      - POSTGRES_DB=${DATABASE_NAME}
      - POSTGRES_USER=${DATABASE_USERNAME}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - FORCE_SSL=FALSE
    restart: on-failure
    networks:
      agora_network:
        # GeoServer datastores restored from production connect to host "db"
        aliases:
          - db

  api-dev:
    # FastAPI service (live reload enabled for development)
    image: agora-api-image:geoserver_proxy
    container_name: agora-dev-api
    depends_on:
      - db-dev
    command: |
      bash -c '
      cd /src &&
      # Wait for database before starting API
      while !</dev/tcp/db-dev/5432; do sleep 1; done &&
      poetry config virtualenvs.create false &&
      uvicorn app.main:app --reload --workers 1 --host 0.0.0.0 --port 8000'
    volumes:
      - ./src:/src
    environment:
      - WORKING_DIR=/src
      - DATABASE_HOSTNAME=${DATABASE_HOSTNAME}
      - DATABASE_PORT=${DATABASE_PORT}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_USERNAME=${DATABASE_USERNAME}
      - DATABASE_NAME=${DATABASE_NAME}
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES}
      - REFRESH_TOKEN_EXPIRE_MINUTES=${REFRESH_TOKEN_EXPIRE_MINUTES}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - GEOSERVER_ADMIN_USER=${GEOSERVER_ADMIN_USER}
      - GEOSERVER_ADMIN_PASSWORD=${GEOSERVER_ADMIN_PASSWORD}
    ports:
      - ${API_PORT}:8000
    networks:
      - agora_network
  geoserver-dev:
    # GeoServer for map publishing and spatial layers
    image: docker.osgeo.org/geoserver:3.0.1
    container_name: agora-geoserver-dev-container
    environment:
      - GEOSERVER_ADMIN_USER=${GEOSERVER_ADMIN_USER}
      - GEOSERVER_ADMIN_PASSWORD=${GEOSERVER_ADMIN_PASSWORD}
      # IMPORTANT: Make sure to not use quotes (") in the next lines
      - INSTALL_EXTENSIONS=true
      - STABLE_EXTENSIONS=vectortiles,mbstyle
    volumes:
      # Persistent GeoServer data directory
      - agora-geoserver-data-dev:/opt/geoserver_data
    ports:
      - ${GEOSERVER_PORT}:8080
    networks:
      - agora_network

  metabase:
    image: metabase/metabase:v0.63.5
    container_name: metabase
    ports:
      - "3001:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5433
      MB_DB_USER: metabase
      MB_DB_PASS: ${METABASE_DB_PASSWORD}
      MB_DB_HOST: metabase_db
    networks:
      - agora_network
    restart: unless-stopped
    depends_on:
      - metabase_db
  metabase_db:
    # Separate Postgres database for Metabase metadata
    image: postgres:15
    container_name: metabase_db
    expose:
      - 5433
    environment:
      POSTGRES_DB: metabase
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: ${METABASE_DB_PASSWORD}
    volumes:
      - metabase_db_data:/var/lib/postgresql/data
    networks:
      - agora_network
    command: ["-p", "5433"]
    restart: unless-stopped

networks:
  agora_network:
    # Shared bridge network for all containers
    driver: bridge

volumes:
  # Named volumes to persist service data between restarts
  agora-dev-db-data:
  agora-geoserver-data-dev:
  metabase_db_data:
